; Плата 2, приемник с детектором.
; Ловит пакеты передатчика, считает по ним уровень движения
; и зажигает RGB: зеленый если пусто, красный если кто-то есть.

[env:esp32-s3-devkitc-1]
platform = espressif32 @ ^8.0.0   ; проверял на 8.0.0, это ESP-IDF 6.1
board = esp32-s3-devkitc-1
framework = espidf

monitor_speed = 115200
